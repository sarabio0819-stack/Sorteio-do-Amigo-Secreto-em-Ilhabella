<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Amigo Secreto Time RCT | 2026</title>
  <link rel="stylesheet" href="estilo.css">
  <script src="https://cdn.jsdelivr.net/npm/js-confetti@latest/dist/js-confetti.browser.js"></script>
</head>
<body>
  <div class="main-container">
    
    <!-- TELA 1: LOGIN -->
    <div id="auth-card" class="card">
      <h1>🌴 Amigo Secreto Time RCT | 2026</h1>
      <h2>Acessar o Sorteio</h2>
      
      <label for="user-select">Quem é você?</label>
      <select id="user-select">
        <option value="">Selecione seu nome</option>
      </select>

      <label for="password-input">Palavra-passe:</label>
      <input type="password" id="password-input" placeholder="Digite a palavra-passe">

      <button onclick="entrar()">Entrar 🌊</button>

      <button onclick="reiniciarSorteio()" class="btn-reset">
        ⚙️ Resetar / Novo Sorteio (Organizador)
      </button>
    </div>

    <!-- TELA 2: ROLETA -->
    <div id="wheel-card" class="card hidden">
      <h2>Olá, <span id="user-display-name"></span>! 👋</h2>
      <p class="subtitle">Clique no botão para girar a roleta!</p>

      <div class="wheel-wrapper">
        <div class="pointer"></div>
        <canvas id="wheel-canvas" width="340" height="340"></canvas>
      </div>

      <button id="btn-spin" onclick="girarRoleta()" class="btn-spin">🎰 Girar Roleta</button>
    </div>

    <!-- TELA 3: REVELAÇÃO -->
    <div id="result-card" class="card hidden result-card">
      <div class="gift-icon">🎁</div>
      <h2>Parabéns!</h2>
      <p class="result-text">Seu amigo secreto é:</p>
      <div id="drawn-name" class="drawn-name-box"></div>
      <p class="secret-tip">🤫 Mantenha segredo até a entrega de presentes!</p>
    </div>

  </div>

  <audio id="bg-music" loop preload="auto" src="havaiana.mp3"></audio>

  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <script src="app.js"></script>
</body>
</html>
