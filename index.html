<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#a8e0d7">

  <title>Amigo Secreto Time RCT | 2026</title>

  <link rel="stylesheet" href="style.css">

  <!-- Biblioteca de confetes -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

  <script defer src="app.js"></script>
</head>

<body>

  <!-- Música opcional -->
  <audio id="bg-music" loop preload="auto">
    <source src="havaiana.mp3" type="audio/mpeg">
  </audio>

  <main class="main-container">

    <!-- TELA 1: ENTRADA -->
    <section id="auth-card" class="card">

      <div class="palm">🌴</div>

      <h1>Amigo Secreto</h1>
      <h2>TIME RCT • 2026</h2>

      <p class="intro">
        Acesse para descobrir quem você tirou!
      </p>

      <label for="user-select">Quem é você?</label>

      <select id="user-select">
        <option value="">Selecione seu nome</option>
      </select>

      <label for="password-input">Palavra-passe:</label>

      <input
        type="password"
        id="password-input"
        placeholder="Digite a palavra-passe"
        autocomplete="current-password"
      >

      <button
        id="btn-enter"
        type="button"
        onclick="entrar()"
      >
        Entrar 🌊
      </button>

      <button
        type="button"
        onclick="reiniciarSorteio()"
        class="btn-reset"
      >
        ⚙ Resetar / Novo Sorteio (Organizador)
      </button>

      <p class="small-note">
        Prepare-se para a surpresa!
      </p>

    </section>


    <!-- TELA 2: GLOBO -->
    <section id="wheel-card" class="card hidden">

      <h2 class="greeting">
        Olá, <span id="user-display-name"></span>!
      </h2>

      <p class="subtitle">
        Clique para girar o globo do sorteio.
      </p>

      <div class="bingo-stage">

        <!-- GLOBO -->
        <div
          id="globo"
          class="globo-container"
          aria-label="Globo transparente com bolinhas coloridas"
        >

          <div class="globo-wireframe"></div>

          <canvas
            id="bingo-canvas"
            width="200"
            height="200"
          ></canvas>

          <div class="globe-shine"></div>

        </div>

        <!-- BASE E TUBULAÇÃO -->
        <div class="globe-neck"></div>
        <div class="tubo-saida"></div>

        <!-- BOLINHA QUE SAI DO GLOBO -->
        <div
          id="drawn-ball"
          class="drawn-ball"
          aria-live="polite"
        >

          <div class="ball-half ball-top"></div>
          <div class="ball-half ball-bottom"></div>

          <div
            id="ball-name"
            class="ball-name"
          ></div>

        </div>

      </div>

      <div id="bingo-phrase" class="bingo-phrase">
        Pronto para começar?
      </div>

      <button
        id="btn-spin"
        type="button"
        onclick="executarSorteioEAnimacao()"
      >
        🎰 Sortear Amigo Secreto
      </button>

    </section>


    <!-- TELA 3: REVELAÇÃO -->
    <section id="result-card" class="card hidden">

      <div class="result-confetti" aria-hidden="true">
        🎉
      </div>

      <h2 class="result-title">
        VOCÊ TIROU:
      </h2>

      <div id="drawn-name" class="drawn-name-box">
        ---
      </div>

      <p class="secret-tip">
        🤫 Mantenha segredo até a entrega do presente!
      </p>

    </section>

  </main>

</body>
</html>
