<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Amigo Secreto - Roleta</title>
  <link rel="stylesheet" href="style.css" />
  <!-- Biblioteca JS-Confetti para efeito de comemoração -->
  <script src="https://cdn.jsdelivr.net/npm/js-confetti@latest/dist/js-confetti.browser.js"></script>
</head>
  <audio id="bg-music" loop src="https://cdn.pixabay.com/download/audio/2022/05/27/audio_1808fbf07a.mp3?filename=ukulele-beach-112423.mp3"></audio>
<body>
  <div class="main-container">
    
    <!-- TELA 1: LOGIN -->
    <div id="auth-card" class="card">
      <h1>🎄 Amigo Secreto</h1>
      <h2>Acessar o Sorteio</h2>
      
      <label for="user-select">Quem é você?</label>
      <select id="user-select">
        <option value="">-- Selecione seu nome --</option>
      </select>

      <label for="password-input">Palavra-passe:</label>
      <input type="password" id="password-input" placeholder="Digite a palavra-passe" />

      <button onclick="entrar()">Entrar</button>
    </div>

    <!-- TELA 2: ROLETA -->
    <div id="wheel-card" class="card hidden">
      <h2>Olá, <span id="user-display-name"></span>! 👋</h2>
      <p class="subtitle">Clique no botão para girar a roleta!</p>

      <div class="wheel-wrapper">
        <div class="pointer"></div>
        <canvas id="wheel-canvas" width="340" height="340"></canvas>
      </div>

      <button id="btn-spin" onclick="girarRoleta()" class="btn-spin">🎰 Girar Roleta</button>
    </div>

    <!-- TELA 3: REVELAÇÃO DO AMIGO SECRETO -->
    <div id="result-card" class="card hidden result-card">
      <div class="gift-icon">🎁</div>
      <h2>Parabéns!</h2>
      <p class="result-text">Seu amigo secreto é:</p>
      <div id="drawn-name" class="drawn-name-box"></div>
      <p class="secret-tip">🤫 Mantenha segredo até a entrega de presentes!</p>
    </div>

    <!-- BOTÃO DO ORGANIZADOR PARA REINICIAR/RESETAR O SORTEIO -->
    <div style="text-align: center; margin-top: 20px;">
      <button onclick="reiniciarSorteio()" style="background: #666; font-size: 13px; padding: 8px 15px; width: auto; opacity: 0.8; margin-top: 0;">
        🔄 Resetar / Novo Sorteio (Organizador)
      </button>
    </div>

  </div>

  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <script src="app.js"></script>
</body>
</html>
