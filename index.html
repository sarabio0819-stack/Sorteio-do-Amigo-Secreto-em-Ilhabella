<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Amigo Secreto da Equipe</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <h1>🎄 Amigo Secreto</h1>

    <!-- TELA DE LOGIN / SELEÇÃO DE NOME -->
    <div id="auth-card" class="card">
      <h2>Acessar o Sorteio</h2>
      
      <label for="user-select">Quem é você?</label>
      <select id="user-select">
        <option value="">-- Selecione seu nome --</option>
      </select>

      <label for="password-input">Palavra-passe:</label>
      <input type="password" id="password-input" placeholder="Digite a palavra-passe" />

      <button onclick="entrar()">Entrar</button>
    </div>

    <!-- TELA DA ROLETA / RESULTADO -->
    <div id="app-card" class="card hidden">
      <h2>Olá, <span id="user-display-name"></span>! 👋</h2>

      <div id="roulette-container" class="roulette-box">
        <p>Clique no botão para girar a roleta e descobrir seu amigo secreto:</p>
        <div id="roulette-display" class="roulette-name">???</div>
      </div>

      <button id="btn-girar" onclick="girarRoleta()" class="btn-spin">🎰 Girar Roleta</button>

      <div id="result-area" class="result-box hidden">
        <h3 id="result-title">Seu amigo secreto é:</h3>
        <div id="drawn-name" class="final-name"></div>
      </div>
    </div>
  </div>

  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <script src="app.js"></script>
</body>
</html>
