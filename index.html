<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Amigo Secreto Time RCT | 2026</title>
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #a8e0d7;
      background: linear-gradient(135deg, #a8e0d7 0%, #d8e2dc 50%, #f1d3b0 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .main-container {
      width: 100%;
      max-width: 400px;
    }

    .card {
      background: #ffffff;
      border-radius: 16px;
      padding: 25px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.15);
      text-align: center;
    }

    h1 {
      color: #b84335;
      font-size: 20px;
      margin-bottom: 8px;
    }

    h2 {
      color: #2b6777;
      font-size: 15px;
      margin-bottom: 20px;
    }

    label {
      display: block;
      text-align: left;
      font-size: 13px;
      font-weight: bold;
      color: #333;
      margin: 12px 0 4px 0;
    }

    select, input[type="password"] {
      width: 100%;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid #ccc;
      font-size: 14px;
      margin-bottom: 10px;
    }

    button {
      width: 100%;
      padding: 12px;
      margin-top: 15px;
      border: none;
      border-radius: 8px;
      background-color: #52ab98;
      color: white;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background-color: #428b7b;
    }

    .btn-reset {
      background: transparent;
      color: #666;
      font-size: 12px;
      border: 1px dashed #aaa;
      margin-top: 15px;
    }

    .hidden {
      display: none !important;
    }

    /* MÁQUINA DE BINGO */
    .bingo-wrapper {
      position: relative;
      width: 220px;
      height: 220px;
      margin: 15px auto;
    }

    .bingo-sphere {
      width: 200px;
      height: 200px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.4);
      border: 4px solid #ffffff;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
      overflow: hidden;
      margin: 0 auto;
    }

    .shaking {
      animation: shake 0.1s infinite alternate;
    }

    @keyframes shake {
      0% { transform: translate(-2px, 2px); }
      100% { transform: translate(2px, -2px); }
    }

    .bingo-phrase {
      font-size: 14px;
      font-weight: bold;
      color: #2b6777;
      margin-top: 10px;
      min-height: 20px;
    }

    .winning-ball {
      position: absolute;
      top: 35%;
      left: 38%;
      width: 50px;
      height: 50px;
      border-radius: 50%;
      background: #d63031;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 22px;
      opacity: 0;
      transform: scale(0.2);
      transition: all 0.6s ease;
      z-index: 10;
    }

    .winning-ball.eject {
      opacity: 1;
      transform: scale(1.6);
    }

    .drawn-name-box {
      background: #52ab98;
      color: white;
      font-size: 22px;
      font-weight: bold;
      padding: 15px;
      border-radius: 10px;
      margin: 15px 0;
    }
  </style>
</head>
<body>

  <div class="main-container">
    
    <!-- TELA 1: LOGIN -->
    <div id="auth-card" class="card">
      <h1>🌴 Amigo Secreto Time RCT | 2026</h1>
      <h2>Acessar o Sorteio</h2>
      
      <label for="user-select">Quem é você?</label>
      <select id="user-select">
        <option value="">Selecione seu nome</option>
      </select>

      <label for="password-input">Palavra-passe:</label>
      <input type="password" id="password-input" placeholder="Digite a palavra-passe">

      <button onclick="entrar()">Entrar 🌊</button>

      <button onclick="reiniciarSorteio()" class="btn-reset">
        ⚙️ Resetar / Novo Sorteio (Organizador)
      </button>
    </div>

    <!-- TELA 2: MÁQUINA DE BINGO -->
    <div id="wheel-card" class="card hidden">
      <h2>Olá, <span id="user-display-name"></span>! 👋</h2>
      <p style="font-size:13px; color:#555;">Clique abaixo para realizar o sorteio!</p>

      <div class="bingo-wrapper">
        <div id="bingo-sphere" class="bingo-sphere">
          <canvas id="bingo-canvas" width="200" height="200"></canvas>
        </div>
        <div id="winning-ball" class="winning-ball">🎁</div>
      </div>

      <div id="bingo-phrase" class="bingo-phrase">Pronto para começar?</div>

      <button id="btn-spin" onclick="executarAnimacaoBingo()">🎰 Sortear Amigo Secreto</button>
    </div>

    <!-- TELA 3: REVELAÇÃO -->
    <div id="result-card" class="card hidden">
      <h2 style="color:#b84335;">🎉 VOCÊ TIROU:</h2>
      <div id="drawn-name" class="drawn-name-box">---</div>
      <p style="font-size:12px; color:#666;">🤫 Mantenha segredo até a entrega!</p>
    </div>

  </div>

  <audio id="bg-music" loop preload="auto" src="havaiana.mp3"></audio>

  <script>
    let bingoAnimationId = null;
    let balls = [];
    const colors = ['#ff7675', '#74b9ff', '#55efc4', '#ffeaa7', '#a29bfe'];

    function initBingoCanvas() {
      const canvas = document.getElementById('bingo-canvas');
      if (!canvas) return;
      const ctx = canvas.getContext('2d');
      balls = [];
      
      for (let i = 0; i < 15; i++) {
        balls.push({
          x: 30 + Math.random() * 120,
          y: 30 + Math.random() * 120,
          radius: 10,
          color: colors[i % colors.length],
          vx: (Math.random() - 0.5) * 3,
          vy: (Math.random() - 0.5) * 3
        });
      }

      function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        balls.forEach(b => {
          b.x += b.vx;
          b.y += b.vy;

          if (b.x < 10 || b.x > 190) b.vx *= -1;
          if (b.y < 10 || b.y > 190) b.vy *= -1;

          ctx.beginPath();
          ctx.arc(b.x, b.y, b.radius, 0, Math.PI * 2);
          ctx.fillStyle = b.color;
          ctx.fill();
          ctx.closePath();
        });
        bingoAnimationId = requestAnimationFrame(draw);
      }
      if (bingoAnimationId) cancelAnimationFrame(bingoAnimationId);
      draw();
    }

    function iniciarEfeitoBingo(nomeSorteado) {
      const btn = document.getElementById('btn-spin');
      const sphere = document.getElementById('bingo-sphere');
      const phraseEl = document.getElementById('bingo-phrase');
      const winningBall = document.getElementById('winning-ball');
      const audio = document.getElementById('bg-music');

      if (audio) audio.play().catch(() => {});
      if (btn) btn.disabled = true;
      if (sphere) sphere.classList.add('shaking');

      balls.forEach(b => { b.vx *= 2.5; b.vy *= 2.5; });

      const frases = ["Agitando os nomes...", "Misturando...", "O destino está escolhendo..."];
      let idx = 0;
      if (phraseEl) phraseEl.innerText = frases[0];
      
      const intervalFrases = setInterval(() => {
        idx = (idx + 1) % frases.length;
        if (phraseEl) phraseEl.innerText = frases[idx];
      }, 1500);

      setTimeout(() => {
        clearInterval(intervalFrases);
        if (sphere) sphere.classList.remove('shaking');
        if (phraseEl) phraseEl.innerText = "Saindo a bolinha!";

        setTimeout(() => {
          if (winningBall) winningBall.classList.add('eject');
          
          setTimeout(() => {
            document.getElementById('wheel-card').classList.add('hidden');
            document.getElementById('result-card').classList.remove('hidden');
            document.getElementById('drawn-name').innerText = nomeSorteado;
          }, 1200);
        }, 500);
      }, 5000);
    }

    function executarAnimacaoBingo() {
      if (typeof girarRoleta === 'function') {
        girarRoleta();
      } else if (window.amigoSorteado) {
        iniciarEfeitoBingo(window.amigoSorteado);
      } else {
        iniciarEfeitoBingo("Amigo Sorteado");
      }
    }

    window.addEventListener('load', initBingoCanvas);
  </script>

  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <script src="app.js"></script>
</body>
</html>
