<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Amigo Secreto Time RCT | 2026</title>
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background: linear-gradient(135deg, #a8e0d7 0%, #d8e2dc 50%, #f1d3b0 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      overflow-x: hidden;
    }

    .main-container {
      width: 100%;
      max-width: 440px;
    }

    .card {
      background: #ffffff;
      border-radius: 20px;
      padding: 25px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.12);
      text-align: center;
      position: relative;
    }

    h1 {
      color: #b84335;
      font-size: 20px;
      margin-bottom: 6px;
    }

    h2 {
      color: #2b6777;
      font-size: 15px;
      margin-bottom: 20px;
    }

    label {
      display: block;
      text-align: left;
      font-size: 13px;
      font-weight: bold;
      color: #333;
      margin: 12px 0 4px 0;
    }

    select, input[type="password"] {
      width: 100%;
      padding: 12px;
      border-radius: 10px;
      border: 1px solid #ccc;
      font-size: 14px;
      margin-bottom: 10px;
      outline: none;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 15px;
      border: none;
      border-radius: 10px;
      background-color: #52ab98;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.2s;
    }

    button:hover {
      background-color: #428b7b;
      transform: translateY(-1px);
    }

    .btn-reset {
      background: transparent;
      color: #666;
      font-size: 12px;
      border: 1px dashed #aaa;
      margin-top: 15px;
    }

    .hidden {
      display: none !important;
    }

    /* GLOBO DE SORTEIO ESTILO TELE SENA */
    .bingo-stage {
      position: relative;
      width: 260px;
      height: 260px;
      margin: 15px auto;
    }

    .globo-container {
      width: 200px;
      height: 200px;
      border-radius: 50%;
      margin: 0 auto;
      position: relative;
      background: radial-gradient(circle at 30% 30%, rgba(255,255,255,0.8), rgba(200,230,240,0.3));
      border: 6px solid #b0c4de;
      box-shadow: inset 0 0 20px rgba(255,255,255,0.8), 0 8px 25px rgba(0,0,0,0.15);
      overflow: hidden;
    }

    /* Linhas da gaiola do globo */
    .globo-wireframe {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      border-radius: 50%;
      border: 2px dashed rgba(100, 120, 140, 0.4);
      pointer-events: none;
    }
    .globo-wireframe::before {
      content: '';
      position: absolute;
      top: 15%; left: 0; right: 0; bottom: 15%;
      border-top: 2px solid rgba(100, 120, 140, 0.3);
      border-bottom: 2px solid rgba(100, 120, 140, 0.3);
      border-radius: 50%;
    }

    .shaking {
      animation: shakeGlobe 0.08s infinite alternate ease-in-out;
    }

    @keyframes shakeGlobe {
      0% { transform: translate(-3px, 2px) rotate(-1deg); }
      100% { transform: translate(3px, -2px) rotate(1deg); }
    }

    /* Tubo de saída na base */
    .tubo-saida {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      width: 40px;
      height: 35px;
      background: linear-gradient(90deg, #999, #eee, #999);
      border-radius: 0 0 10px 10px;
      z-index: 2;
      border: 2px solid #777;
    }

    /* A BOLINHA QUE SAI */
    .drawn-ball {
      position: absolute;
      top: 170px;
      left: 50%;
      transform: translateX(-50%) scale(0);
      width: 70px;
      height: 70px;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, #ff7675, #d63031);
      color: white;
      font-size: 30px;
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: 0 10px 25px rgba(0,0,0,0.3), inset -3px -3px 8px rgba(0,0,0,0.3);
      z-index: 20;
      transition: all 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    /* Animação: caindo e vindo para a frente */
    .drawn-ball.drop-out {
      top: 90px;
      transform: translateX(-50%) scale(1.8);
    }

    /* Animação: chacoalhando antes de abrir */
    .drawn-ball.shake-ball {
      animation: ballShake 0.1s infinite alternate;
    }

    @keyframes ballShake {
      0% { transform: translateX(-50%) scale(1.8) rotate(-6deg); }
      100% { transform: translateX(-50%) scale(1.8) rotate(6deg); }
    }

    /* Revelação de Abertura */
    .ball-split {
      position: relative;
      width: 100%;
      height: 100%;
    }

    .bingo-phrase {
      font-size: 15px;
      font-weight: bold;
      color: #2b6777;
      margin-top: 15px;
      min-height: 24px;
    }

    /* CARD DO RESULTADO FINAL */
    .drawn-name-box {
      background: linear-gradient(135deg, #52ab98, #2b6777);
      color: white;
      font-size: 26px;
      font-weight: bold;
      padding: 20px;
      border-radius: 15px;
      margin: 20px 0;
      letter-spacing: 1.5px;
      box-shadow: 0 8px 20px rgba(43, 103, 119, 0.3);
      animation: popIn 0.5s ease-out;
    }

    @keyframes popIn {
      0% { transform: scale(0.5); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }
  </style>

  <!-- Biblioteca de Confetes -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
</head>
<body>

  <div class="main-container">
    
    <!-- TELA 1: LOGIN -->
    <div id="auth-card" class="card">
      <h1>🌴 Amigo Secreto Time RCT | 2026</h1>
      <h2>Acessar o Sorteio</h2>
      
      <label for="user-select">Quem é você?</label>
      <select id="user-select">
        <option value="">Selecione seu nome</option>
      </select>

      <label for="password-input">Palavra-passe:</label>
      <input type="password" id="password-input" placeholder="Digite a palavra-passe">

      <button onclick="entrar()">Entrar 🌊</button>

      <button onclick="reiniciarSorteio()" class="btn-reset">
        ⚙️️ Resetar / Novo Sorteio (Organizador)
      </button>
    </div>

    <!-- TELA 2: MÁQUINA DE BINGO COM GLOBO -->
    <div id="wheel-card" class="card hidden">
      <h2>Olá, <span id="user-display-name"></span>! 👋</h2>
      <p style="font-size:13px; color:#555;">Clique abaixo para girar o globo do sorteio!</p>

      <div class="bingo-stage">
        <div id="globo" class="globo-container">
          <div class="globo-wireframe"></div>
          <canvas id="bingo-canvas" width="200" height="200"></canvas>
        </div>
        <div class="tubo-saida"></div>
        
        <!-- Bolinha que cai e abre -->
        <div id="drawn-ball" class="drawn-ball">🎁</div>
      </div>

      <div id="bingo-phrase" class="bingo-phrase">Pronto para começar?</div>

      <button id="btn-spin" onclick="executarAnimacaoBingo()">🎰 Sortear Amigo Secreto</button>
    </div>

    <!-- TELA 3: REVELAÇÃO -->
    <div id="result-card" class="card hidden">
      <h2 style="color:#b84335;">🎉 VOCÊ TIROU:</h2>
      <div id="drawn-name" class="drawn-name-box">---</div>
      <p style="font-size:13px; color:#666;">🤫 Mantenha segredo até a entrega do presente!</p>
    </div>

  </div>

  <audio id="bg-music" loop preload="auto" src="havaiana.mp3"></audio>

  <script>
    let bingoAnimationId = null;
    let balls = [];
    const colors = ['#ff7675', '#74b9ff', '#55efc4', '#ffeaa7', '#a29bfe', '#fd79a8', '#e17055', '#00b894'];

    // Inicializa as bolinhas pulando dentro do globo
    function initBingoCanvas() {
      const canvas = document.getElementById('bingo-canvas');
      if (!canvas) return;
      const ctx = canvas.getContext('2d');
      balls = [];
      
      for (let i = 0; i < 20; i++) {
        balls.push({
          x: 40 + Math.random() * 120,
          y: 40 + Math.random() * 120,
          radius: 10,
          color: colors[i % colors.length],
          vx: (Math.random() - 0.5) * 3,
          vy: (Math.random() - 0.5) * 3
        });
      }

      function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        balls.forEach(b => {
          b.x += b.vx;
          b.y += b.vy;

          // Colisão com bordas circulares
          const dx = b.x - 100;
          const dy = b.y - 100;
          const dist = Math.sqrt(dx * dx + dy * dy);

          if (dist + b.radius > 95) {
            const angle = Math.atan2(dy, dx);
            b.vx = -Math.cos(angle) * Math.abs(b.vx);
            b.vy = -Math.sin(angle) * Math.abs(b.vy);
          }

          ctx.beginPath();
          ctx.arc(b.x, b.y, b.radius, 0, Math.PI * 2);
          ctx.fillStyle = b.color;
          ctx.fill();
          ctx.strokeStyle = '#ffffff';
          ctx.lineWidth = 1.5;
          ctx.stroke();
          ctx.closePath();
        });
        bingoAnimationId = requestAnimationFrame(draw);
      }
      if (bingoAnimationId) cancelAnimationFrame(bingoAnimationId);
      draw();
    }

    // Função de Confetes Explosivos
    function dispararConfetes() {
      if (typeof confetti === 'function') {
        confetti({
          particleCount: 150,
          spread: 80,
          origin: { y: 0.6 }
        });
      }
    }

    // ANIMAÇÃO DE SORTEIO ESTILO TELE SENA
    function iniciarEfeitoBingo(nomeSorteado) {
      const btn = document.getElementById('btn-spin');
      const globo = document.getElementById('globo');
      const phraseEl = document.getElementById('bingo-phrase');
      const drawnBall = document.getElementById('drawn-ball');
      const audio = document.getElementById('bg-music');

      if (audio) audio.play().catch(() => {});
      if (btn) btn.disabled = true;
      if (globo) globo.classList.add('shaking');

      // 1. Aumenta muito a velocidade das bolinhas dentro do globo
      balls.forEach(b => { b.vx *= 4; b.vy *= 4; });

      phraseEl.innerText = "Agitando o globo...";

      setTimeout(() => {
        phraseEl.innerText = "A escolher a bolinha feliz...";
      }, 1500);

      // 2. A bolinha cai do tubo e vai para o centro
      setTimeout(() => {
        if (globo) globo.classList.remove('shaking');
        phraseEl.innerText = "A bolinha saiu!";

        drawnBall.classList.add('drop-out');

        // 3. A bolinha chacoalha com suspense no centro da tela
        setTimeout(() => {
          drawnBall.classList.add('shake-ball');
          phraseEl.innerText = "A abrir a bolinha...";

          // 4. Revela o nome e dispara os confetes!
          setTimeout(() => {
            drawnBall.classList.remove('shake-ball');
            
            document.getElementById('wheel-card').classList.add('hidden');
            document.getElementById('result-card').classList.remove('hidden');
            document.getElementById('drawn-name').innerText = nomeSorteado;
            
            dispararConfetes();
          }, 1500);

        }, 1000);

      }, 3500);
    }

    function executarAnimacaoBingo() {
      if (typeof girarRoleta === 'function') {
        girarRoleta();
      } else if (window.amigoSorteado) {
        iniciarEfeitoBingo(window.amigoSorteado);
      } else {
        iniciarEfeitoBingo("MARINA");
      }
    }

    window.addEventListener('load', initBingoCanvas);
  </script>

  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <script src="app.js"></script>
</body>
</html>
