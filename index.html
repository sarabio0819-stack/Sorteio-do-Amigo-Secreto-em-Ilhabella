<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Amigo Secreto Time RCT | 2026</title>
  
  <!-- Biblioteca JS-Confetti -->
  <script src="https://cdn.jsdelivr.net/npm/js-confetti@latest/dist/js-confetti.browser.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background: linear-gradient(135deg, #a8e0d7 0%, #d8e2dc 50%, #f1d3b0 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      overflow-x: hidden;
    }

    .main-container {
      width: 100%;
      max-width: 420px;
    }

    .card {
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(10px);
      border-radius: 20px;
      padding: 30px 25px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.6);
      text-align: center;
    }

    h1 {
      color: #b84335;
      font-size: 22px;
      font-weight: 700;
      margin-bottom: 6px;
    }

    h2 {
      color: #2b6777;
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 20px;
    }

    label {
      display: block;
      text-align: left;
      font-size: 13px;
      font-weight: 600;
      color: #333;
      margin-top: 15px;
      margin-bottom: 6px;
    }

    select, input[type="password"] {
      width: 100%;
      padding: 12px 14px;
      border-radius: 12px;
      border: 1px solid #dcdcdc;
      background-color: #f7f9f8;
      font-size: 14px;
      outline: none;
      transition: all 0.2s ease;
    }

    select:focus, input[type="password"]:focus {
      border-color: #52ab98;
      background-color: #ffffff;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 25px;
      border: none;
      border-radius: 12px;
      background-color: #52ab98;
      color: white;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s ease, transform 0.1s ease;
      box-shadow: 0 4px 12px rgba(82, 171, 152, 0.3);
    }

    button:hover {
      background-color: #439382;
    }

    button:active {
      transform: scale(0.98);
    }

    .btn-reset {
      background: transparent;
      color: #777;
      font-size: 12px;
      font-weight: 500;
      margin-top: 20px;
      padding: 8px;
      box-shadow: none;
      border: 1px dashed #ccc;
    }

    .btn-reset:hover {
      background: rgba(0, 0, 0, 0.04);
      color: #444;
    }

    .hidden {
      display: none !important;
    }

    /* MÁQUINA DE BINGO ANIMAÇÃO */
    .bingo-wrapper {
      position: relative;
      width: 280px;
      height: 280px;
      margin: 15px auto;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .bingo-sphere {
      position: relative;
      width: 220px;
      height: 220px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.25);
      border: 6px solid rgba(255, 255, 255, 0.8);
      box-shadow: inset 0 0 25px rgba(255, 255, 255, 0.8), 0 10px 25px rgba(0, 0, 0, 0.15);
      backdrop-filter: blur(4px);
      overflow: hidden;
    }

    .bingo-sphere.shaking {
      animation: shakeSphere 0.12s infinite alternate ease-in-out;
    }

    @keyframes shakeSphere {
      0% { transform: translate(-3px, 3px) rotate(-2deg); }
      100% { transform: translate(3px, -3px) rotate(2deg); }
    }

    .bingo-stand {
      position: absolute;
      bottom: 5px;
      width: 140px;
      height: 20px;
      background: #2b6777;
      border-radius: 10px;
      z-index: -1;
    }

    .bingo-phrase {
      font-size: 15px;
      font-weight: 600;
      color: #2b6777;
      min-height: 24px;
      margin-top: 10px;
      animation: pulseText 1.2s infinite alternate;
    }

    @keyframes pulseText {
      0% { opacity: 0.6; }
      100% { opacity: 1; }
    }

    /* BOLINHA SORTEADA (SAÍDA DA MÁQUINA) */
    .winning-ball {
      position: absolute;
      width: 60px;
      height: 60px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #ff7675, #d63031);
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      font-weight: bold;
      font-size: 20px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
      z-index: 50;
      opacity: 0;
      transform: scale(0.2) translateY(80px);
      transition: all 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .winning-ball.eject {
      opacity: 1;
      transform: scale(1.8) translateY(-20px);
    }

    .result-title {
      font-size: 20px;
      color: #b84335;
      font-weight: 800;
      margin-bottom: 12px;
      letter-spacing: 0.5px;
    }

    .drawn-name-box {
      background: #52ab98;
      color: white;
      font-size: 26px;
      font-weight: bold;
      padding: 16px 20px;
      border-radius: 14px;
      margin: 15px 0;
      letter-spacing: 1px;
      box-shadow: 0 6px 16px rgba(82, 171, 152, 0.3);
    }

    .secret-tip {
      font-size: 13px;
      color: #666;
    }
  </style>
</head>
<body>
  <div class="main-container">
    
    <!-- TELA 1: LOGIN -->
    <div id="auth-card" class="card">
      <h1>🌴 Amigo Secreto Time RCT | 2026</h1>
      <h2>Acessar o Sorteio</h2>
      
      <label for="user-select">Quem é você?</label>
      <select id="user-select">
        <option value="">Selecione seu nome</option>
      </select>

      <label for="password-input">Palavra-passe:</label>
      <input type="password" id="password-input" placeholder="Digite a palavra-passe">

      <button onclick="entrar()">Entrar 🌊</button>

      <button onclick="reiniciarSorteio()" class="btn-reset">
        ⚙️ Resetar / Novo Sorteio (Organizador)
      </button>
    </div>

    <!-- TELA 2: MÁQUINA DE BINGO (SORTEIO) -->
    <div id="wheel-card" class="card hidden">
      <h2>Olá, <span id="user-display-name"></span>! 👋</h2>
      <p class="subtitle">Clique no botão para sortear seu amigo secreto!</p>

      <div class="bingo-wrapper">
        <div id="bingo-sphere" class="bingo-sphere">
          <canvas id="bingo-canvas" width="220" height="220"></canvas>
        </div>
        <div class="bingo-stand"></div>
        <div id="winning-ball" class="winning-ball">🎁</div>
      </div>

      <div id="bingo-phrase" class="bingo-phrase">Pronto para misturar os nomes?</div>

      <button id="btn-spin" onclick="executarAnimacaoBingo()" class="btn-spin">🎰 Sortear Amigo Secreto</button>
    </div>

    <!-- TELA 3: REVELAÇÃO -->
    <div id="result-card" class="card hidden">
      <div class="result-title">🎉 VOCÊ TIROU:</div>
      <div id="drawn-name" class="drawn-name-box">---</div>
      <p class="secret-tip">🤫 Mantenha segredo até a entrega de presentes!</p>
    </div>

  </div>

  <audio id="bg-music" loop preload="auto" src="havaiana.mp3"></audio>

  <!-- Script da Animação da Máquina de Bingo -->
  <script>
    const jsConfetti = new JSConfetti();
    let bingoAnimationId = null;
    let balls = [];
    const colors = ['#ff7675', '#74b9ff', '#55efc4', '#ffeaa7', '#a29bfe', '#fd79a8'];

    function initBingoCanvas() {
      const canvas = document.getElementById('bingo-canvas');
      const ctx = canvas.getContext('2d');
      balls = [];
      
      for (let i = 0; i < 20; i++) {
        balls.push({
          x: 40 + Math.random() * 140,
          y: 40 + Math.random() * 140,
          radius: 12,
          color: colors[i % colors.length],
          vx: (Math.random() - 0.5) * 4,
          vy: (Math.random() - 0.5) * 4
        });
      }

      function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        const centerX = 110;
        const centerY = 110;
        const sphereRadius = 98;

        balls.forEach(b => {
          b.x += b.vx;
          b.y += b.vy;

          // Colisão circular simples
          const dx = b.x - centerX;
          const dy = b.y - centerY;
          const dist = Math.sqrt(dx * dx + dy * dy);

          if (dist + b.radius > sphereRadius) {
            const angle = Math.atan2(dy, dx);
            b.x = centerX + Math.cos(angle) * (sphereRadius - b.radius);
            b.y = centerY + Math.sin(angle) * (sphereRadius - b.radius);
            b.vx = -b.vx + (Math.random() - 0.5);
            b.vy = -b.vy + (Math.random() - 0.5);
          }

          ctx.beginPath();
          ctx.arc(b.x, b.y, b.radius, 0, Math.PI * 2);
          ctx.fillStyle = b.color;
          ctx.fill();
          ctx.lineWidth = 2;
          ctx.strokeStyle = 'rgba(255, 255, 255, 0.8)';
          ctx.stroke();
          ctx.closePath();
        });

        bingoAnimationId = requestAnimationFrame(draw);
      }

      if (bingoAnimationId) cancelAnimationFrame(bingoAnimationId);
      draw();
    }

    // Função responsável pela animação dos 5 segundos
    function iniciarEfeitoBingo(nomeSorteado) {
      const btn = document.getElementById('btn-spin');
      const sphere = document.getElementById('bingo-sphere');
      const phraseEl = document.getElementById('bingo-phrase');
      const winningBall = document.getElementById('winning-ball');
      
      btn.disabled = true;
      sphere.classList.add('shaking');

      // Aumentar velocidade das bolinhas
      balls.forEach(b => {
        b.vx *= 3;
        b.vy *= 3;
      });

      const frases = [
        "Agitando os nomes...",
        "Misturando...",
        "O destino está escolhendo..."
      ];

      let idx = 0;
      phraseEl.innerText = frases[0];
      const intervalFrases = setInterval(() => {
        idx = (idx + 1) % frases.length;
        phraseEl.innerText = frases[idx];
      }, 1500);

      // Duração da mistura: 5 Segundos
      setTimeout(() => {
        clearInterval(intervalFrases);
        sphere.classList.remove('shaking');
        phraseEl.innerText = "Saindo a bolinha premiada!";

        // Travar movimento suave das bolinhas
        balls.forEach(b => {
          b.vx *= 0.1;
          b.vy *= 0.1;
        });

        // Ejeção da Bolinha
        setTimeout(() => {
          winningBall.classList.add('eject');
          
          // Revelar Nome após pequena pausa
          setTimeout(() => {
            document.getElementById('wheel-card').classList.add('hidden');
            document.getElementById('result-card').classList.remove('hidden');
            document.getElementById('drawn-name').innerText = nomeSorteado;

            // Lançar Confetes
            jsConfetti.addConfetti({
              emojis: ['🎉', '🎁', '✨', '⭐'],
              confettiRadius: 6,
              confettiNumber: 60,
            });
          }, 1200);

        }, 500);

      }, 5000);
    }

    // Integração com a função de sorteio existente do seu app.js
    function executarAnimacaoBingo() {
      // Caso a função girarRoleta ou obterSorteio exista no app.js, nós a chamamos
      if (typeof girarRoleta === 'function') {
        // Se a sua função girarRoleta já obtém o nome sorteado:
        girarRoleta();
      } else if (window.amigoSorteado) {
        iniciarEfeitoBingo(window.amigoSorteado);
      } else {
        // Exemplo genérico de segurança para testes
        iniciarEfeitoBingo("Amigo Sorteado");
      }
    }

    // Inicializa o Canvas assim que a janela carrega
    window.addEventListener('load', () => {
      initBingoCanvas();
    });
  </script>

  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <script src="app.js"></script>
</body>
</html>
