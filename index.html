<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Amigo Secreto Time RCT | 2026</title>
  
  <!-- Biblioteca JS-Confetti -->
  <script src="https://cdn.jsdelivr.net/npm/js-confetti@latest/dist/js-confetti.browser.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background: linear-gradient(135deg, #a8e0d7 0%, #d8e2dc 50%, #f1d3b0 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .main-container {
      width: 100%;
      max-width: 420px;
    }

    .card {
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(10px);
      border-radius: 20px;
      padding: 30px 25px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.6);
      text-align: center;
    }

    h1 {
      color: #b84335;
      font-size: 22px;
      font-weight: 700;
      margin-bottom: 6px;
    }

    h2 {
      color: #2b6777;
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 20px;
    }

    label {
      display: block;
      text-align: left;
      font-size: 13px;
      font-weight: 600;
      color: #333;
      margin-top: 15px;
      margin-bottom: 6px;
    }

    select, input[type="password"] {
      width: 100%;
      padding: 12px 14px;
      border-radius: 12px;
      border: 1px solid #dcdcdc;
      background-color: #f7f9f8;
      font-size: 14px;
      outline: none;
      transition: all 0.2s ease;
    }

    select:focus, input[type="password"]:focus {
      border-color: #52ab98;
      background-color: #ffffff;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 25px;
      border: none;
      border-radius: 12px;
      background-color: #52ab98;
      color: white;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s ease, transform 0.1s ease;
      box-shadow: 0 4px 12px rgba(82, 171, 152, 0.3);
    }

    button:hover {
      background-color: #439382;
    }

    button:active {
      transform: scale(0.98);
    }

    .btn-reset {
      background: transparent;
      color: #777;
      font-size: 12px;
      font-weight: 500;
      margin-top: 20px;
      padding: 8px;
      box-shadow: none;
      border: 1px dashed #ccc;
    }

    .btn-reset:hover {
      background: rgba(0, 0, 0, 0.04);
      color: #444;
    }

    .hidden {
      display: none !important;
    }

    /* ROLETA E RESULTADOS */
    .subtitle {
      font-size: 14px;
      color: #555;
      margin-bottom: 20px;
    }

    .wheel-wrapper {
      position: relative;
      display: inline-block;
      margin: 10px 0;
    }

    .pointer {
      position: absolute;
      top: -15px;
      left: 50%;
      transform: translateX(-50%);
      width: 0;
      height: 0;
      border-left: 15px solid transparent;
      border-right: 15px solid transparent;
      border-top: 25px solid #e74c3c;
      z-index: 10;
    }

    canvas {
      border-radius: 50%;
      box-shadow: 0 8px 20px rgba(0,0,0,0.15);
    }

    .drawn-name-box {
      background: #52ab98;
      color: white;
      font-size: 24px;
      font-weight: bold;
      padding: 15px;
      border-radius: 12px;
      margin: 20px 0;
      letter-spacing: 1px;
    }

    .gift-icon {
      font-size: 50px;
      margin-bottom: 10px;
    }

    .secret-tip {
      font-size: 13px;
      color: #666;
    }
  </style>
</head>
<body>
  <div class="main-container">
    
    <!-- TELA 1: LOGIN -->
    <div id="auth-card" class="card">
      <h1>🌴 Amigo Secreto Time RCT | 2026</h1>
      <h2>Acessar o Sorteio</h2>
      
      <label for="user-select">Quem é você?</label>
      <select id="user-select">
        <option value="">Selecione seu nome</option>
      </select>

      <label for="password-input">Palavra-passe:</label>
      <input type="password" id="password-input" placeholder="Digite a palavra-passe">

      <button onclick="entrar()">Entrar 🌊</button>

      <button onclick="reiniciarSorteio()" class="btn-reset">
        ⚙️ Resetar / Novo Sorteio (Organizador)
      </button>
    </div>

    <!-- TELA 2: ROLETA -->
    <div id="wheel-card" class="card hidden">
      <h2>Olá, <span id="user-display-name"></span>! 👋</h2>
      <p class="subtitle">Clique no botão para girar a roleta!</p>

      <div class="wheel-wrapper">
        <div class="pointer"></div>
        <canvas id="wheel-canvas" width="340" height="340"></canvas>
      </div>

      <button id="btn-spin" onclick="girarRoleta()" class="btn-spin">🎰 Girar Roleta</button>
    </div>

    <!-- TELA 3: REVELAÇÃO -->
    <div id="result-card" class="card hidden result-card">
      <div class="gift-icon">🎁</div>
      <h2>Parabéns!</h2>
      <p class="result-text">Seu amigo secreto é:</p>
      <div id="drawn-name" class="drawn-name-box"></div>
      <p class="secret-tip">🤫 Mantenha segredo até a entrega de presentes!</p>
    </div>

  </div>

  <audio id="bg-music" loop preload="auto" src="havaiana.mp3"></audio>

  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <script src="app.js"></script>
</body>
</html>
